[package]
name = "filmcraft-ai"
description = "FilmCraft AI assistant: multi-provider LLM chat (BYOK) that edits through engine commands, with local skills, optional web search and user-approved plans"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
filmcraft-engine = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "platform-verifier", "json"] }
rustls = { version = "0.23", default-features = false }
rustls-rustcrypto = "0.0.2-alpha"
